<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Peptide Findings</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --maxw:1180px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#1a1a19; --plane:#0d0d0d;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55;
}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px 80px}
header{border-bottom:1px solid var(--border); background:var(--surface-1); margin-bottom:28px}
header .wrap{padding-top:28px; padding-bottom:22px}
h1{font-size:clamp(22px,3.4vw,30px); margin:0 0 6px; letter-spacing:-0.02em}
.sub{color:var(--text-secondary); margin:0; font-size:15px}
nav{display:flex; flex-wrap:wrap; gap:4px; margin-top:18px}
nav button{
  font:inherit; font-size:13.5px; padding:7px 13px; border-radius:7px; cursor:pointer;
  border:1px solid transparent; background:transparent; color:var(--text-secondary);
}
nav button:hover{background:var(--plane)}
nav button[aria-selected="true"]{background:var(--text-primary); color:var(--surface-1)}
.theme-btn{position:absolute; top:22px; right:16px; border:1px solid var(--border);
  background:var(--surface-1); color:var(--text-secondary); border-radius:7px;
  padding:6px 11px; font:inherit; font-size:13px; cursor:pointer}
header .wrap{position:relative}
@media(max-width:560px){ h1{padding-right:76px} }
section{display:none} section.on{display:block}
.card{background:var(--surface-1); border:1px solid var(--border); border-radius:12px;
  padding:22px 24px; margin-bottom:20px}
h2{font-size:19px; margin:0 0 4px; letter-spacing:-0.01em}
h3{font-size:15.5px; margin:26px 0 8px}
.lede{color:var(--text-secondary); margin:0 0 18px; max-width:76ch}
p{max-width:78ch}
.note{font-size:13.5px; color:var(--text-secondary); margin-top:12px; max-width:80ch}
.verdict{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px}
@media(max-width:780px){.verdict{grid-template-columns:1fr}}
.vcard{background:var(--surface-1); border:1px solid var(--border);
  border-left:3px solid var(--vc); border-radius:12px; padding:20px 22px}
.vcard .k{font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.vcard .a{font-size:26px; font-weight:650; margin:6px 0 8px; letter-spacing:-0.02em}
.vcard p{font-size:14px; color:var(--text-secondary); margin:0}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:14px; margin:4px 0 20px}
.tile{background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:15px 17px}
.tile .v{font-size:25px; font-weight:650; letter-spacing:-0.02em; line-height:1.15}
.tile .l{font-size:12.5px; color:var(--text-secondary); margin-top:3px}
figure{margin:0 0 6px}
figcaption{font-size:13px; color:var(--text-secondary); margin-top:8px; max-width:80ch}
svg{display:block; max-width:100%; height:auto; overflow:visible}
.ax{font-size:11px; fill:var(--muted)}
.axlab{font-size:12px; fill:var(--text-secondary)}
.ftitle{font-size:13px; fill:var(--text-primary); font-weight:600}
.legend{display:flex; flex-wrap:wrap; gap:16px; margin:10px 0 2px; font-size:13px;
  color:var(--text-secondary); align-items:center}
.legend i{width:11px; height:11px; border-radius:3px; display:inline-block; margin-right:6px;
  vertical-align:-1px}
table{border-collapse:collapse; width:100%; font-size:13.5px; margin-top:6px}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--grid)}
th{color:var(--text-secondary); font-weight:600; font-size:12.5px}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
details{margin-top:14px} summary{cursor:pointer; font-size:13.5px; color:var(--text-secondary)}
.tt{position:fixed; pointer-events:none; opacity:0; transition:opacity .09s;
  background:var(--text-primary); color:var(--surface-1); font-size:12.5px;
  padding:7px 10px; border-radius:7px; z-index:50; max-width:260px; line-height:1.45}
.tt b{color:var(--surface-1)}
.flag{display:inline-block; font-size:11.5px; padding:2px 7px; border-radius:20px;
  border:1px solid var(--border); color:var(--text-secondary); margin-left:7px}
ul{max-width:78ch; padding-left:20px} li{margin-bottom:7px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px;
  background:var(--plane); padding:1px 5px; border-radius:4px}
.seqrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px;
  white-space:nowrap; overflow-x:auto}
.hl{background:var(--s4); color:#0b0b0b; padding:0 2px; border-radius:3px}
</style>
</head>

<script>
const TABS=[["s-verdict","Verdict"],["s-data","The measurements"],["s-screen","Feature screen"],
  ["s-lead","The one lead"],["s-model","Can we model?"],["s-seq","What the sequences are"],
  ["s-limits","Limits"]];
const BLOTS=["Blot 1","Blot 2","Blot 3"];
const CBLOT={"Blot 1":"var(--s1)","Blot 2":"var(--s2)","Blot 3":"var(--s3)"};
const fmt=(v,d=2)=>v===null||v===undefined||Number.isNaN(v)?"—":(v>=0&&d===2?"+":"")+v.toFixed(d);
const f2=(v,d=2)=>v===null||v===undefined?"—":v.toFixed(d);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* ---------- tooltip ---------- */
const tt=document.getElementById("tt");
function bindTip(el,html){
  el.addEventListener("pointerenter",e=>{tt.innerHTML=html;tt.style.opacity=1;move(e)});
  el.addEventListener("pointermove",move);
  el.addEventListener("pointerleave",()=>tt.style.opacity=0);
  function move(e){
    const p=12; let x=e.clientX+p, y=e.clientY+p;
    const r=tt.getBoundingClientRect();
    if(x+r.width>innerWidth-8) x=e.clientX-r.width-p;
    if(y+r.height>innerHeight-8) y=e.clientY-r.height-p;
    tt.style.left=x+"px"; tt.style.top=y+"px";
  }
}
/* ---------- tiny svg helper ---------- */
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},parent){const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k,attrs[k]); if(parent)parent.appendChild(n); return n;}
function svgRoot(w,h){const s=document.createElementNS(NS,"svg");
  s.setAttribute("viewBox",`0 0 ${w} ${h}`); s.setAttribute("width",w); s.setAttribute("height",h);
  s.setAttribute("role","img"); return s;}

/* ============ 1. VERDICT ============ */
function verdict(){
  const P=DATA.permutation, R=DATA.rbs;
  const ceil=DATA.reliability.filter(r=>BLOTS.includes(r.block))
    .reduce((a,r)=>a+r.max_detectable_correlation,0)/3;
  const oof=DATA.models.filter(m=>!m.model.startsWith("Baseline"));
  const worstOof=Math.max(...oof.map(m=>m.mean_within_blot_spearman));
  const rf=DATA.insample.find(m=>m.model.includes("forest"));
  return `
  <div class="verdict">
    <div class="vcard" style="--vc:var(--critical)">
      <div class="k">Model-based prediction</div>
      <div class="a">No — and it was tested</div>
      <p>Four model families, two cross-validation schemes, split at peptide level.
      Every out-of-fold score was negative (best ${fmt(worstOof)}). The same random forest
      scores ${f2(rf.in_sample_spearman)} in-sample. With 32 peptides and 34 correlated
      features a model memorises the set and learns nothing transferable.</p>
    </div>
    <div class="vcard" style="--vc:var(--good)">
      <div class="k">Biological information</div>
      <div class="a">Yes — one lead</div>
      <p>The exploratory screen of 34 descriptors found nothing above chance. But one
      hypothesis taken from the literature — mRNA accessibility at the translation-initiation
      region — holds in all three blots (&rho; ${fmt(R.rho)}, p = ${R.p_single.toFixed(4)}).
      That is a lead to design an experiment around, not a rule.</p>
    </div>
  </div>

  <div class="tiles">
    <div class="tile"><div class="v">32</div><div class="l">peptides, split 8 / 13 / 11 across three blots</div></div>
    <div class="tile"><div class="v">${fmt(P.observed)}</div><div class="l">best feature correlation in the screen</div></div>
    <div class="tile"><div class="v">${fmt(P.null_median)}</div><div class="l">what chance alone produces</div></div>
    <div class="tile"><div class="v">${f2(ceil)}</div><div class="l">reliability ceiling — a real effect was detectable</div></div>
  </div>

  <div class="card">
    <h2>The shape of the answer</h2>
    <p class="lede">Two questions with different answers, so they should not be collapsed into one.</p>
    <p>The data support <strong>description, candidate prioritisation within each blot, and one
    hypothesis worth testing</strong>. They do not support a predictive model or a design rule.
    The binding constraints are structural rather than biological: an effective sample size of
    8, 13 and 11 because the three blots share no common scale; a cleavage region that was
    deliberately held constant, so it could never vary; and a library that happens to sit in a
    narrow band of the most-studied feature.</p>
    <p>None of that refutes the underlying goal. Fix the calibration and raise the peptide
    count and the same question becomes answerable.</p>
    <div class="note">Every number on this page is computed from
    <code>Information_for_Baris_corrected.xlsx</code> by the scripts in
    <code>ouput/analysis/</code> and <code>ddls_claude/analysis/</code>. Nothing is illustrative.</div>
  </div>`;
}

/* ============ 2. MEASUREMENTS ============ */
function replicatePlot(){
  const W=1080,FH=220,PL=44,PR=14,PT=26,PB=58,gap=26;
  const H=(FH+gap)*3;
  const s=svgRoot(W,H);
  BLOTS.forEach((b,bi)=>{
    const rows=DATA.summary.filter(d=>d.block===b).sort((a,c)=>a.mean-c.mean);
    const reps=DATA.replicates.filter(d=>d.block===b);
    const y0=bi*(FH+gap);
    const maxv=Math.max(...reps.map(d=>d.value))*1.08;
    const iw=W-PL-PR, ih=FH-PT-PB;
    const X=i=>PL+iw*((i+0.5)/rows.length);
    const Y=v=>y0+PT+ih-(v/maxv)*ih;
    const g=el("g",{},s);
    el("text",{x:PL,y:y0+14,class:"ftitle"},g).textContent=`${b} — ${rows.length} peptides`;
    // gridlines
    const ticks=[0,1,2,3,4,5,6].filter(t=>t<=maxv);
    ticks.forEach(t=>{
      el("line",{x1:PL,x2:W-PR,y1:Y(t),y2:Y(t),stroke:"var(--grid)","stroke-width":1},g);
      el("text",{x:PL-7,y:Y(t)+3.5,class:"ax","text-anchor":"end"},g).textContent=t;
    });
    // reference line at 1 = gel mean
    el("line",{x1:PL,x2:W-PR,y1:Y(1),y2:Y(1),stroke:"var(--axis)","stroke-width":1.5,
      "stroke-dasharray":"4 3"},g);
    el("text",{x:W-PR,y:Y(1)-5,class:"ax","text-anchor":"end"},g).textContent="gel mean";
    rows.forEach((r,i)=>{
      const x=X(i);
      el("line",{x1:x,x2:x,y1:y0+PT,y2:y0+PT+ih,stroke:"var(--grid)","stroke-width":1,opacity:.5},g);
      reps.filter(d=>d.peptide_id===r.peptide_id).forEach((d,k)=>{
        const c=el("circle",{cx:x+(k-1)*4.4,cy:Y(d.value),r:3.6,fill:CBLOT[b],
          stroke:"var(--surface-1)","stroke-width":2,opacity:.95},g);
        bindTip(c,`<b>${esc(r.peptide_id)}</b>${r.gene?" · "+esc(r.gene):""}<br>${esc(d.replicate)}: ${f2(d.value)}<br>${esc(b)}`);
      });
      const m=el("rect",{x:x-9,y:Y(r.mean)-1.5,width:18,height:3,rx:1.5,fill:"var(--text-primary)"},g);
      bindTip(m,`<b>${esc(r.peptide_id)}</b>${r.gene?" · "+esc(r.gene):""}<br>mean ${f2(r.mean)} · median ${f2(r.median)}<br>CV ${f2(r.cv)}`);
      const lab=el("text",{x:x,y:y0+PT+ih+15,class:"ax","text-anchor":"end",
        transform:`rotate(-52 ${x} ${y0+PT+ih+15})`},g);
      lab.textContent=r.peptide_id;
    });
    el("line",{x1:PL,x2:W-PR,y1:y0+PT+ih,y2:y0+PT+ih,stroke:"var(--axis)","stroke-width":1},g);
    el("text",{x:6,y:y0+PT+ih/2,class:"axlab","text-anchor":"middle",
      transform:`rotate(-90 6 ${y0+PT+ih/2})`},g).textContent="fold-change";
  });
  return s;
}
function measurements(){

function nullPlot(){
  const P=DATA.permutation;
  const W=640,H=250,PL=50,PR=20,PT=20,PB=52;
  const s=svgRoot(W,H);
  const iw=W-PL-PR, ih=H-PT-PB;
  const lo=0, hi=0.9, X=v=>PL+iw*((v-lo)/(hi-lo));
  // schematic density of the null around its median (illustrative envelope of the real stats)
  const med=P.null_median, p95=P.null_p95;
  const sd=(p95-med)/1.645;
  const pts=[];
  for(let v=lo;v<=hi;v+=0.005){
    const d=Math.exp(-0.5*Math.pow((v-med)/sd,2));
    pts.push([X(v),PT+ih-d*ih*0.92]);
  }
  el("path",{d:"M"+pts.map(p=>p.join(",")).join("L")+`L${X(hi)},${PT+ih}L${X(lo)},${PT+ih}Z`,
    fill:"var(--s1)",opacity:.18},s);
  el("path",{d:"M"+pts.map(p=>p.join(",")).join("L"),fill:"none",stroke:"var(--s1)","stroke-width":2},s);
  [[med,"var(--s1)","chance median "+med.toFixed(2),-1],
   [P.observed,"var(--s2)","observed best "+P.observed.toFixed(2),1]].forEach(([v,c,lab,side])=>{
    el("line",{x1:X(v),x2:X(v),y1:PT,y2:PT+ih,stroke:c,"stroke-width":2.2},s);
    const t=el("text",{x:X(v)+side*7,y:PT+12,class:"ax","text-anchor":side>0?"start":"end"},s);
    t.textContent=lab; t.setAttribute("fill",c);
  });
  el("line",{x1:PL,x2:W-PR,y1:PT+ih,y2:PT+ih,stroke:"var(--axis)","stroke-width":1},s);
  [0,0.2,0.4,0.6,0.8].forEach(t=>el("text",{x:X(t),y:PT+ih+18,class:"ax","text-anchor":"middle"},s)
    .textContent=t.toFixed(1));
  el("text",{x:PL+iw/2,y:H-10,class:"axlab","text-anchor":"middle"},s)
    .textContent="largest |ρ| found when the outcome is shuffled";
  return s;
}

function rbsScatter(){
  const W=1020,FW=320,FH=250,gapx=20,PL=52,PB=48,PT=28;
  const s=svgRoot(W,FH+10);
  BLOTS.forEach((b,bi)=>{
    const pts=DATA.scatter.filter(d=>d.block===b);
    const x0=bi*(FW+gapx);
    const xs=pts.map(p=>p.dg_rbs_plus48), ys=pts.map(p=>p.mean);
    const xmin=Math.min(...xs)-1, xmax=Math.max(...xs)+1;
    const ymax=Math.max(...ys)*1.1;
    const iw=FW-PL+20, ih=FH-PT-PB;
    const X=v=>x0+PL+(v-xmin)/(xmax-xmin)*(iw-30);
    const Y=v=>PT+ih-(v/ymax)*ih;
    const g=el("g",{},s);
    el("text",{x:x0+PL,y:14,class:"ftitle"},g).textContent=b;
    const rho=DATA.rbs["blot"+(bi+1)];
    el("text",{x:x0+PL,y:28,class:"ax"},g).textContent=`ρ = ${fmt(rho)}  ·  n = ${pts.length}`;
    [0,1,2,3,4,5,6].filter(t=>t<=ymax).forEach(t=>{
      el("line",{x1:x0+PL,x2:x0+PL+iw-30,y1:Y(t),y2:Y(t),stroke:"var(--grid)","stroke-width":1},g);
      el("text",{x:x0+PL-7,y:Y(t)+3.5,class:"ax","text-anchor":"end"},g).textContent=t;
    });
    pts.forEach(p=>{
      const c=el("circle",{cx:X(p.dg_rbs_plus48),cy:Y(p.mean),r:4.5,fill:CBLOT[b],
        stroke:"var(--surface-1)","stroke-width":2},g);
      bindTip(c,`<b>${esc(p.peptide_id)}</b>${p.gene?" · "+esc(p.gene):""}<br>ΔG ${f2(p.dg_rbs_plus48,1)} kcal/mol<br>secretion ${f2(p.mean)}<br>${esc(b)}`);
    });
    el("line",{x1:x0+PL,x2:x0+PL+iw-30,y1:PT+ih,y2:PT+ih,stroke:"var(--axis)","stroke-width":1},g);
    // x ticks at whole kcal/mol steps
    const step=Math.ceil((xmax-xmin)/5);
    for(let t=Math.ceil(xmin/step)*step;t<=xmax;t+=step){
      el("line",{x1:X(t),x2:X(t),y1:PT+ih,y2:PT+ih+4,stroke:"var(--axis)","stroke-width":1},g);
      el("text",{x:X(t),y:PT+ih+16,class:"ax","text-anchor":"middle"},g).textContent=t;
    }
    el("text",{x:x0+PL+(iw-30)/2,y:FH-10,class:"axlab","text-anchor":"middle"},g)
      .textContent="ΔG (kcal/mol) →  less structured";
    if(bi===0) el("text",{x:x0+10,y:PT+ih/2,class:"axlab","text-anchor":"middle",
      transform:`rotate(-90 ${x0+10} ${PT+ih/2})`},g).textContent="fold-change";
  });
  return s;
}

  const u=DATA.uniprot;
  const exact=u.filter(r=>r.exact_match).length;
  const diff=u.filter(r=>r.c_terminus_differs).length;
  const ann=u.filter(r=>r.native_last3).length;
  const d=document.createElement("div");
  d.innerHTML=`
  <div class="card">
    <h2>The cleavage region was engineered, not inherited</h2>
    <p class="lede">The thesis identifies all 32 peptides as native <em>B. subtilis</em> 168
    signal peptides. Checking each against its UniProt entry shows the native C-termini are
    diverse — but every supplied peptide ends A-S-A.</p>
    <div class="tiles">
      <div class="tile"><div class="v">${exact} / 32</div><div class="l">match their native signal peptide exactly</div></div>
      <div class="tile"><div class="v">${diff} / ${ann}</div><div class="l">differ from native at the C-terminus</div></div>
      <div class="tile"><div class="v">32 / 32</div><div class="l">supplied peptides ending A-S-A</div></div>
      <div class="tile"><div class="v">${DATA.native_motifs.length}</div><div class="l">distinct native C-terminal motifs</div></div>
    </div>
    <figure id="motiffig"></figure>
    <figcaption>Native C-terminal tripeptides (grey, blue where ASA) against the supplied
    library (orange, bottom). A constant cannot explain variation between peptides.</figcaption>
    <p class="note">This answers an open question and is a defensible design choice — it holds
    signal-peptidase processing constant. It also means the library could never report on
    C-region effects, by construction, and that the A-x-A motif Fu et al. associate with good
    performers is here a <strong>design constant, not a variable</strong>.</p>
  </div>

  <div class="card">
    <h2>Consequences</h2>
    <ul>
      <li><strong>These are engineered peptides, not wild-type ones.</strong> Comparisons to
      published results on “the pel signal peptide” compare different molecules. SP6/Pel natively
      ends ANA; SP1/AmyE natively ends LAG — not an A-x-A motif at all — and is six residues
      longer here.</li>
      <li><strong>A candidate explanation for some poor performers.</strong> SP1/AmyE is the classic
      <em>B. subtilis</em> secretion tag and ranks 7th of 8 in its blot, while also being one of
      the most heavily modified peptides in the set.</li>
      <li><strong>Caveat.</strong> UniProt SIGNAL annotations are often predictions rather than
      experimentally determined sites, so a length disagreement may reflect the predictor. The
      composition result does not depend on this — 32-of-32 uniform against a 13-way-diverse
      background is not an annotation artefact.</li>
    </ul>
    <details open><summary>Per-peptide comparison against UniProt</summary>
    <table><thead><tr><th>Peptide</th><th>Gene</th><th>Accession</th>
      <th class="num">Supplied len</th><th class="num">Native len</th>
      <th>Supplied −3−2−1</th><th>Native −3−2−1</th><th>Exact match</th></tr></thead><tbody>
    ${u.map(r=>`<tr><td><strong>${esc(r.peptide_id)}</strong></td><td>${esc(r.gene)}</td>
      <td>${esc(r.accession||"—")}</td><td class="num">${r.supplied_length??"—"}</td>
      <td class="num">${r.native_signal_length??"—"}</td>
      <td class="seqrow">${esc(r.supplied_last3)}</td>
      <td class="seqrow">${r.native_last3?(r.c_terminus_differs?'<span class="hl">'+esc(r.native_last3)+'</span>':esc(r.native_last3)):"—"}</td>
      <td>${r.exact_match?"yes":"no"}</td></tr>`).join("")}
    </tbody></table></details>
  </div>

  <div class="card">
    <h2>Does amylase performance predict collagen performance?</h2>
    <p class="lede">Five peptides are also among the 15 best performers in Fu et al., who measured
    α-amylase secretion by enzyme activity.</p>
    <table><thead><tr><th>Peptide</th><th>Gene</th><th>Blot</th>
      <th class="num">Collagen rank</th><th class="num">AmyS activity (U/mL)</th>
      <th class="num">vs native SP</th></tr></thead><tbody>
    ${DATA.cross_assay.map(r=>`<tr><td><strong>${esc(r.peptide_id)}</strong></td>
      <td>${esc(r.gene)}</td><td>${esc(r.block)}</td>
      <td class="num">${r.within_blot_rank} of ${r.blot_n}</td>
      <td class="num">${f2(r.fu_amys_activity_U_per_mL,1)}</td>
      <td class="num">${f2(r.fu_fold_vs_native_sp)}×</td></tr>`).join("")}
    </tbody></table>
    <p class="note">Rank agreement is <strong>ρ = −0.20</strong> (n = 5). Their single best amylase
    peptide sits in the bottom half for collagen. But note the finding above: these are not the
    same sequences Fu et al. measured, so this is confounded with the C-terminal modification and
    is suggestive at best. Target-dependence is independently documented by all three sources.</p>
  </div>`;
  d.querySelector("#motiffig").appendChild(motifPlot());
  return d;
}

/* ============ 7. LIMITS ============ */
function limits(){
  return `
  <div class="card">
    <h2>What this analysis cannot say</h2>
    <ul>
      <li><strong>Association is not causation.</strong> Nothing here establishes mechanism. A null
      on association is also not evidence that signal-peptide sequence is biologically irrelevant
      to secretion — only that these descriptors do not track these measurements at this n.</li>
      <li><strong>Region boundaries are computed, not observed.</strong> No SignalP, no experimental
      cleavage data. The h/c boundary is demonstrably unstable, so those features were reported
      as sensitivity only.</li>
      <li><strong>The folding energies are not initiation-region energies</strong> in the published
      sense — the true transcription start site is unknown.</li>
      <li><strong>No cross-blot scale exists.</strong> All rankings are within-blot. There is no
      unified ranking here because the data do not support one.</li>
      <li><strong>The other-protein table</strong> has four peptides and undefined category
      thresholds. It is context, not validation.</li>
      <li><strong>SP31 and the SP9 zero</strong> are unresolved data questions, carried through
      rather than patched.</li>
      <li><strong>Generalisation.</strong> Results apply to this collagen construct, host, assay and
      conditions.</li>
    </ul>
  </div>

  <div class="card">
    <h2>What would make the question answerable</h2>
    <ul>
      <li><strong>A shared reference sample on every blot.</strong> One or two identical control lanes
      per gel would put values on a common scale with an auditable method. At present the blot
      boundary is an impassable wall, and it is the single largest structural limitation.</li>
      <li><strong>More peptides measured comparably.</strong> Effective sample sizes are 8, 13 and 11.
      This matters more than any analytical refinement.</li>
      <li><strong>Raw densitometry.</strong> Would let the normalisation be audited, the SP9 zero
      resolved, and the SP4 secondary band assessed.</li>
      <li><strong>The transcription start site and full 5′UTR.</strong> Needed to test the one positive
      lead against its published definition.</li>
      <li><strong>Variation in the C-region</strong>, if cleavage effects are of interest — this library
      holds it constant.</li>
    </ul>
    <h3>If a model is attempted later</h3>
    <p>Split at peptide/design level, never at replicate-row level, and treat prediction of
    peptides from a <strong>new experimental batch</strong> as the honest test. Set a held-out set
    aside before modelling begins.</p>
    <p class="note">Any proposed new sequence or “high performer” is a hypothesis for experimental
    testing, not a proven design.</p>
  </div>`;
}

/* ---------- wire up ---------- */
const nav=document.getElementById("nav");
TABS.forEach(([id,label],i)=>{
  const b=document.createElement("button");
  b.textContent=label; b.setAttribute("aria-selected",i===0);
  b.onclick=()=>{
    document.querySelectorAll("section").forEach(s=>s.classList.remove("on"));
    document.getElementById(id).classList.add("on");
    [...nav.children].forEach(c=>c.setAttribute("aria-selected",c===b));
    scrollTo({top:0,behavior:"smooth"});
  };
  nav.appendChild(b);
});
function mount(id,content){
  const s=document.getElementById(id);
  if(typeof content==="string") s.innerHTML=content; else s.appendChild(content);
}
mount("s-verdict",verdict());
mount("s-data",measurements());
mount("s-screen",screen());
mount("s-lead",lead());
mount("s-model",model());
mount("s-seq",seq());
mount("s-limits",limits());

const tb=document.getElementById("themeBtn");
function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  const dark=t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches);
  tb.textContent=dark?"Light":"Dark";
}
let stored=null;
try{stored=localStorage.getItem("sp-theme")}catch(e){}
applyTheme(stored);
// Keep the button label correct if the OS theme changes while no explicit choice is stored.
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{
  if(!document.documentElement.hasAttribute("data-theme")) applyTheme(null);
});
tb.onclick=()=>{
  const dark=document.documentElement.getAttribute("data-theme")==="dark"
    ||(!document.documentElement.hasAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  const next=dark?"light":"dark";
  applyTheme(next);
  try{localStorage.setItem("sp-theme",next)}catch(e){}
};
